<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cursor2api</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="panel">
      <header>
        <p class="eyebrow">Console</p>
        <h1>cursor2api</h1>
        <p class="disclaimer">
          本机 Bridge 只使用你自己的 Cursor Account，不是官方 Cursor 软件。
        </p>
      </header>

      <section class="status-card" aria-live="polite">
        <p class="label">状态</p>
        <p id="health">未启动</p>
        <p id="error" class="error" hidden></p>
      </section>

      <section class="ports">
        <label>
          Preferred Port
          <input id="preferred-port" type="number" min="1" max="65535" value="8765" />
        </label>
        <div>
          <p class="label">Bound Port</p>
          <p id="bound-port">—</p>
        </div>
      </section>

      <div class="actions">
        <button id="start" type="button">启动</button>
        <button id="stop" type="button" class="ghost">停止</button>
      </div>

      <section class="copy-card">
        <p class="label">Cursor API Key / Agent CLI 登录</p>
        <p id="credential-status">正在检测…</p>
        <label>
          Cursor API Key
          <input
            id="cursor-api-key"
            type="password"
            autocomplete="off"
            placeholder="从 Cursor Dashboard 粘贴；已 Agent CLI 登录则不必填写"
          />
        </label>
        <div class="actions">
          <button id="save-key" type="button">保存到凭据库</button>
        </div>
      </section>

      <section class="copy-card">
        <p class="label">Caller 配置</p>
        <textarea
          id="caller-config"
          readonly
          rows="4"
          placeholder="启动 Bridge 后在此复制 Base URL 与 Bridge Token"
        ></textarea>
        <div class="actions">
          <button id="copy-config" type="button" disabled>复制 Caller 配置</button>
          <button id="rotate-token" type="button" class="ghost">轮换 Bridge Token</button>
        </div>
      </section>
    </main>
  </body>
</html>
