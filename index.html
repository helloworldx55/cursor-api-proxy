<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cursor2api</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="panel">
      <header>
        <p class="eyebrow">Console</p>
        <h1>cursor2api</h1>
        <p class="disclaimer">
          本机 Bridge 只使用你自己的 Cursor Account，不是官方 Cursor 软件。
        </p>
      </header>

      <section id="wizard" class="copy-card">
        <p class="label">首次向导</p>
        <p id="wizard-prereqs">正在检测 Agent CLI 与 Bridge Token…</p>
        <p id="wizard-warning" class="disclaimer"></p>
        <label class="check">
          <input id="wizard-autostart" type="checkbox" checked />
          完成后启用 Autostart（默认是）
        </label>
        <div class="actions">
          <button id="complete-wizard" type="button" disabled>完成向导</button>
        </div>
        <p id="wizard-error" class="error" hidden></p>
      </section>

      <section id="release-banner" class="copy-card" hidden>
        <p class="label">Release</p>
        <p id="release-message">正在检查 GitHub Releases…</p>
        <div class="actions">
          <a id="release-download" class="button" href="#" target="_blank" rel="noreferrer">下载</a>
          <button id="dismiss-release" type="button" class="ghost">忽略</button>
        </div>
      </section>

      <section class="status-card" aria-live="polite">
        <p class="label">状态</p>
        <p id="health">未启动</p>
        <p id="cli-block" class="disclaimer" hidden></p>
        <p id="error" class="error" hidden></p>
      </section>

      <div class="actions">
        <button id="redetect-cli" type="button" class="ghost">重新检测 Agent CLI</button>
      </div>

      <section class="ports">
        <label>
          Preferred Port
          <input id="preferred-port" type="number" min="1" max="65535" value="8765" />
        </label>
        <div>
          <p class="label">Bound Port</p>
          <p id="bound-port">—</p>
        </div>
      </section>

      <div class="actions">
        <button id="start" type="button">启动</button>
        <button id="stop" type="button" class="ghost">停止</button>
      </div>

      <section class="copy-card">
        <p class="label">Cursor API Key / Agent CLI 登录</p>
        <p id="credential-status">正在检测…</p>
        <label>
          Cursor API Key
          <input
            id="cursor-api-key"
            type="password"
            autocomplete="off"
            placeholder="从 Cursor Dashboard 粘贴；已 Agent CLI 登录则不必填写"
          />
        </label>
        <div class="actions">
          <button id="save-key" type="button">保存到凭据库</button>
        </div>
      </section>

      <section class="copy-card">
        <p class="label">Caller 配置</p>
        <textarea
          id="caller-config"
          readonly
          rows="4"
          placeholder="启动 Bridge 后在此显示 Base URL；Bridge Token 只写入剪贴板"
        ></textarea>
        <div class="actions">
          <button id="copy-config" type="button" disabled>复制 Caller 配置</button>
          <button id="rotate-token" type="button" class="ghost">轮换 Bridge Token</button>
        </div>
      </section>

      <section id="autostart-settings" class="copy-card" hidden>
        <p class="label">Autostart</p>
        <p id="autostart-warning" class="disclaimer"></p>
        <label class="check">
          <input id="autostart" type="checkbox" />
          登录 Windows 时启动这份 exe
        </label>
      </section>

      <section class="copy-card">
        <p class="label">Request Summary</p>
        <ul id="request-summaries" class="summary-list"></ul>
        <p class="label">滚动日志</p>
        <textarea id="bridge-log" readonly rows="8" placeholder="Bridge 启动后在此显示滚动日志"></textarea>
        <div class="actions">
          <button id="clear-records" type="button" class="ghost">清空 Request Summary 与日志</button>
        </div>
      </section>
    </main>
  </body>
</html>
