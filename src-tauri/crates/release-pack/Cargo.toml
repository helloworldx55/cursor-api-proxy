[package]
name = "cursor2api-release-pack"
version = "0.1.0"
edition = "2021"
description = "Pack the unsigned Windows portable zip for a cursor2api Release"

[lib]
name = "cursor2api_release_pack"

[[bin]]
name = "pack-portable"
path = "src/main.rs"
required-features = ["archive"]

[features]
default = ["archive"]
archive = ["dep:zip"]

[dependencies]
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
