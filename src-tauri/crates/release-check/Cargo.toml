[package]
name = "cursor2api-release-check"
version = "0.1.0"
edition = "2021"
description = "Compare Console version to GitHub Releases and prompt a download without replacing files"

[lib]
name = "cursor2api_release_check"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
